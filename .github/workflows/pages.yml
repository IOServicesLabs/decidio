name: pages

# Builds the browser installer and publishes it on GitHub Pages:
# https://ioserviceslabs.github.io/decidio/
# The installer is installer/ plus installer/builds/, which tools/make_builds.py writes (about 50 MB, not in git).
# One-time setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Do not cancel a deployment that has started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # configure-pages reads the Pages site. In a private repository, that needs `pages: read`.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # make_builds.py needs only the install packages (no TensorFlow).
      - name: Install decidio without TensorFlow
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install -r requirements-install.txt

      - name: Make the idea builds
        run: python tools/make_builds.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: installer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
